<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="VIP Motors Atelier — discreet sourcing, private viewings, and concierge delivery for exceptional vehicles." />
    <meta property="og:title" content="VIP Motors Atelier — Private showroom" />
    <meta property="og:description" content="A darker kind of luxury. Curated vehicles, confidential sourcing, and white-glove ownership." />
    <meta property="og:type" content="website" />
    <title>VIP Motors Atelier | Private showroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "VIP Motors Atelier",
        "description": "Private vehicle sourcing and ownership concierge.",
        "url": "/",
        "priceRange": "$$$$"
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- Keeps Netlify form discovery available while the visible experience is progressively enhanced. -->
    <form name="vip-consultation" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="vip-consultation" />
      <input type="text" name="bot-field" tabindex="-1" autocomplete="off" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="interest" />
      <input type="text" name="timeline" />
      <textarea name="notes"></textarea>
    </form>

    <div id="app"></div>

    <noscript>
      <div class="noscript-message">
        JavaScript is required to view the VIP Motors Atelier experience. Please enable it and reload.
      </div>
    </noscript>

    <script src="script.js" defer></script>
  </body>
</html>
